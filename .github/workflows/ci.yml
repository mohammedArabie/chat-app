name: JavaFX Chat App CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    # Service container for MySQL
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: chat_app
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Database Properties
        run: |
          cp chat-server/src/main/resources/db.properties.template chat-server/src/main/resources/db.properties
          sed -i 's/password=.*/password=root/' chat-server/src/main/resources/db.properties
          sed -i 's/username=.*/username=root/' chat-server/src/main/resources/db.properties
          sed -i 's/url=.*/url=jdbc:mysql:\/\/127.0.0.1:3306\/chat_app/' chat-server/src/main/resources/db.properties

      - name: Initialize Database Schema
        run: mysql -h 127.0.0.1 -u root -proot chat_app < chat-server/src/main/resources/schema.sql


      - name: Run Checkstyle
        run: mvn checkstyle:check

      - name: Build and Run Tests
        run: mvn clean verify -Djava.awt.headless=true